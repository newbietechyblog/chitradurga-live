# Builds the Android app in the cloud (GitHub's computers), so no local computer is needed.
# Run it from the GitHub website or app: Actions -> "Build Android App" -> Run workflow.
# It produces two downloads:
#   chitradurga-live-apk  -> app-release.apk  (install directly on a phone to test)
#   chitradurga-live-aab  -> app-release.aab  (upload this to Google Play Console)
# When the release signing secrets are set, both files are signed with the release key.
name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add our code
        run: |
          flutter create --platforms=android --project-name chitradurga_live --org com.chitradurgalive app
          rm -rf app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml

      - name: Allow internet access in the release build
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml

      - name: Prepare release signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/app/android/upload-keystore.jks"

      - name: Use the release key for signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          python3 - <<'PY'
          import pathlib
          p = next(pathlib.Path('app/android/app').glob('build.gradle*'))
          src = p.read_text()
          if p.suffix == '.kts':
              block = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("KEYSTORE_PATH"))
                  storePassword = System.getenv("KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("KEY_ALIAS")
                  keyPassword = System.getenv("KEY_PASSWORD")
              }
          }
          '''
              src = src.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          else:
              block = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_PATH"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          '''
              src = src.replace("signingConfigs.getByName('debug')", "signingConfigs.getByName('release')")
          assert 'buildTypes {' in src, 'buildTypes block not found'
          src = src.replace('buildTypes {', block + '    buildTypes {', 1)
          p.write_text(src)
          print('Release signing added to', p.name)
          PY

      - name: Build the APK and the Play bundle
        working-directory: app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          grep -h "applicationId" android/app/build.gradle* || true
          flutter build apk --release
          flutter build appbundle --release

      - name: Save the APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: chitradurga-live-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Save the bundle for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: chitradurga-live-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
