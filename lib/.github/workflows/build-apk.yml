# Builds the Android APK in the cloud (GitHub's computers), so no local computer is needed.
# Run it from the GitHub website or app: Actions -> "Build Android APK" -> Run workflow.
# When it finishes, open the run and download "chitradurga-live-apk" (a zip containing app-release.apk).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add our code
        run: |
          flutter create --platforms=android --project-name chitradurga_live app
          rm -rf app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml

      - name: Allow internet access in the release build
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: chitradurga-live-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
